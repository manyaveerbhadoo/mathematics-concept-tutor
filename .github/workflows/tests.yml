name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parser — messy input, malformed input, injection attempts
        run: python tests/test_parser.py

      - name: Concept library — matching, prerequisites, teaching rule
        run: python tests/test_concepts.py

      - name: Conversation — answer checking, no-answer-leak rule
        run: python tests/test_session.py

      - name: Detector benchmark — accuracy must not regress
        run: python tests/benchmark_detect.py

      - name: Bot imports cleanly
        run: python -c "import bot; print(len(bot.library().concepts), 'concepts loaded')"

      - name: No secrets committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git"; exit 1
          fi
          echo "no .env in the repository"
